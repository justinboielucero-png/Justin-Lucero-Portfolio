name: Import original Finals screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-finals-originals.yml'
permissions:
  contents: write
jobs:
  originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Transfer and verify original images
        env:
          OPERATOR_IMAGE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/22deccef-699a-46bd-a398-ed4d33c8e24d.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjk4ZTA4N2IwNjg0NThkMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUwNTQ2N30.Wsz3RfAOvNHifW57Qh6Biszd8dP-KBUWz4ahM8UcPHA"
          LOOP_IMAGE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/0c3e4eb4-8f98-44dc-b9c2-2385075ed342.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjY1ODQwMzQwNjI2MjU1ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUxMzcxNn0.vPT4eNCG60gSgZ7sG2nsWFNTEURvcrbit4V2DrNB5VI"
        run: |
          set -euo pipefail
          mkdir -p assets/finals
          curl --fail --silent --show-error --location --retry 3 "$OPERATOR_IMAGE" --output assets/finals/operators-activities.jpg
          curl --fail --silent --show-error --location --retry 3 "$LOOP_IMAGE" --output assets/finals/loop-activities.jpg
          echo "213819a740a70e13eaefbb4e86a079faa5f65db3eb09d148d678c8cf0837dbe7  assets/finals/operators-activities.jpg" | sha256sum -c -
          echo "20509e3d4309b19852766145cadbcb1c3e5252bc8b90f505f27d131a9789993f  assets/finals/loop-activities.jpg" | sha256sum -c -
      - name: Commit unchanged original screenshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/finals
          if ! git diff --cached --quiet; then
            git commit -m 'Add Finals operators and loop activity screenshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
