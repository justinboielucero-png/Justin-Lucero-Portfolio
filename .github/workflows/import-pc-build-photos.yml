name: Import PC Building photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-pc-build-photos.yml']
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare image folder
        run: mkdir -p assets/portfolio
