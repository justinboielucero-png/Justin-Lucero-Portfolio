name: Import PC Building photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-pc-build-photos.yml']
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download original PC photo package
        env:
          PHOTO_PACKAGE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/8c23a461-4e6b-4fde-a027-e77127ef4622.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTQ3MThmNWI2MTM2Y2YwNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5NDU1NTYxMX0.SwUHjCPM5deLAwpFIWRI8a_G1Dh9vPh4NQWnsNefekI"
        run: |
          curl -fLsS --retry 3 "$PHOTO_PACKAGE" -o /tmp/pc-build-transfer.jpg
          echo '01dcd8956dc65fa0551633cea179b69ab6640d1d166627dec3bd4102e6db8988  /tmp/pc-build-transfer.jpg' | sha256sum -c -
