name: Publish lossless higher-resolution portfolio photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enhance-portfolio-images.yml"
      - "scripts/enhance_portfolio_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Justin's portfolio
        uses: actions/checkout@11bd71901bbe5f3c3a3e4bc90f09d2acff5b2955 # v4.2.2
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Generate full-quality images
        run: python scripts/enhance_portfolio_images.py
      - name: Commit lossless image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/portfolio/*-hq.png
          if git diff --cached --quiet; then
            echo "Already enhanced, no changes."
          else
            git commit -m "Publish lossless enhanced portfolio photos"
            git push origin HEAD:main
          fi
