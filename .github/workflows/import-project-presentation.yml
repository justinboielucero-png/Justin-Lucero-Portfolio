name: Import video project presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-project-presentation.yml']
permissions:
  contents: write
jobs:
  import-project-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Transfer video and its preview frame
        env:
          VIDEO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/90fa3435-d8e2-422a-a315-c354e5864184.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTAwNzkzOWJmYmI4MzMwYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ5Njc5NX0.2wBqZGZ5y48-lnWs95CyJK6qWpb9qnwx9Ve8CEcAyrI"
          POSTER_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3df09d6d-36d1-47b6-877b-2b5e6c18fa9e.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzZkMTFjNzhhMjdiODE2MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5NDU2MjY4MH0.ufAZlHGi6lEKz0dcv0Qu7ssjQswyV6TnRDKsAahNUzw"
        run: |
          set -euo pipefail
          mkdir -p assets/portfolio
          curl --fail --location --silent --show-error --retry 3 "$VIDEO_URL" -o assets/portfolio/video-project-presentation.mp4
          curl --fail --location --silent --show-error --retry 3 "$POSTER_URL" -o assets/portfolio/video-project-poster.jpg
          printf '%s  %s\n' '4ea9deaa04904471ed27df9a7a3eea850e324e3e0b123826fbeab10e63b99497' 'assets/portfolio/video-project-presentation.mp4' | sha256sum -c -
          printf '%s  %s\n' '9693600ef3602addc52331bf3285bd0a7f0420aa8fc95b90cc6009f86d2bdb74' 'assets/portfolio/video-project-poster.jpg' | sha256sum -c -
          file assets/portfolio/video-project-presentation.mp4
      - name: Publish unchanged video and accurate poster
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portfolio/video-project-presentation.mp4 assets/portfolio/video-project-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add original digital literacy project presentation video'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
