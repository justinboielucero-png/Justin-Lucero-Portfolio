name: Import remaining Prelim coursework photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-prelim-c.yml]
permissions:
  contents: write
jobs:
  originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Copy and verify original JPG files
        env:
          FILE1: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/c1c7aebc-fd13-465c-9e17-6211d5fede3a.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDQzYjcyYWYzNTUyNTEwOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ3Njk3NX0.Mh5HoiIB8gVh4aHu4n0WIJtgHANRIpgiHiM7rHzrq9E"
          FILE2: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/dc50d973-2944-4fb8-88e5-58d4a2303c31.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlYXNoIjoiOTJhMGFkMGM0ZjE5OGQwZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ2NDM5Nn0.3fnHrpvrQL0GgzI_Y9su8N6iLPGEf5ZMEbYTVdLtMR8"
          FILE3: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/d8fa48b1-10ae-450b-a5d1-5f3ffa71ffd0.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzgzNTliZjM5MDIyMjA2MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUwOTQyN30.JE8Vyl4FUMboPxNliYF02dBi697T0XlNypirRYGGD2I"
          FILE4: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/1a9aea98-c23a-4752-8964-1e5b00c55508.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTA0ZGQ4NWVjM2Y2YjdjMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUyMjcxOH0.Y_N9PNvjp7Lc_c8KYrtWWxdjURAgExDFy6z9Tq0iQMM"
        run: |
          set -euo pipefail
          mkdir -p assets/prelim
          curl -fsSL --retry 3 "$FILE1" -o "assets/prelim/flowchart-daily-wage.jpg"
          echo 'a99d851f7071b2189d2a45408923ff1573482723e3c2ffa24b33707a7bea64dd  assets/prelim/flowchart-daily-wage.jpg' | sha256sum -c -
          curl -fsSL --retry 3 "$FILE2" -o "assets/prelim/flowchart-square-cube.jpg"
          echo 'c82d4909974c17d91f6be4937640ee116dd2608cb089205559270cf625152e1e  assets/prelim/flowchart-square-cube.jpg' | sha256sum -c -
          curl -fsSL --retry 3 "$FILE3" -o "assets/prelim/activity-escape-input.jpg"
          echo '3e1863dd9fcd0c03b9fab7def373f65d6dbcec457c8b181cfcf2dfa0d4437523  assets/prelim/activity-escape-input.jpg' | sha256sum -c -
          curl -fsSL --retry 3 "$FILE4" -o "assets/prelim/activity-overview-output.jpg"
          echo '6081fdd87094557e6eb480b51ea40789bc9c6f892b645bb9bc20d7b9df7ce14d  assets/prelim/activity-overview-output.jpg' | sha256sum -c -
      - name: Commit images to the website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/prelim/
          if ! git diff --cached --quiet; then git commit -m 'Add remaining Prelim activity images'; git pull --rebase; git push; fi
