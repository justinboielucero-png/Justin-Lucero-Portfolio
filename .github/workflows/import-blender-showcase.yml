name: Import Blender showcase images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-blender-showcase.yml'
permissions:
  contents: write
jobs:
  import-original-and-enhanced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore and verify original and enhanced screenshots
        env:
          BLENDER_TRANSFER: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/dbb4bbf0-d352-47ee-9748-d8ad2055b0ac.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzI3YWZhNzA4Mjg0NmViMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDU1NzgwOH0.HgIcHuhnUozmSklJzhH_2_Ai2-ktFs2XryMIdXWWpME"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BLENDER_TRANSFER" --output /tmp/blender-transfer.jpg
          echo "06ec7558ec220324b04a61bfc37040f3a3ba2b93a67143f304f1832c41d28920  /tmp/blender-transfer.jpg" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, io
          raw=Path('/tmp/blender-transfer.jpg').read_bytes()
          marker=b'\nJUSTIN-BLENDER-ARCHIVE-2026\n'
          assert raw.count(marker)==1,'Archive marker mismatch'
          expected={"blender-neon-character-enhanced.png":"82e758a7664264351f5e5f6cf7b381f95cb24ae7dbf1588ecd2e03712bc32262","blender-grass-scene-enhanced.png":"11691f4aeb8cb9a3dc03f6a74121854e9307eec4b6f809a7cf415d5c5749d760","blender-neon-character-original.jpg":"762e134fef85e4cc833b2cd66f2229bba88727f90ebfd53bc0d48bac6e6b4b2d","blender-grass-scene-original.jpg":"99dac6cd5fe92187401bc42740ec81bae603fb8cc5e1231eb3c5bcd752a6e46e"}
          target=Path('assets/portfolio')
          with zipfile.ZipFile(io.BytesIO(raw.split(marker,1)[1])) as archive:
            assert set(archive.namelist())==set(expected),'Unexpected image filenames'
            for filename, checksum in expected.items():
              data=archive.read(filename)
              assert hashlib.sha256(data).hexdigest()==checksum,filename+' checksum mismatch'
              if filename.endswith('.png'): assert data.startswith(b'\x89PNG\r\n\x1a\n'),filename
              if filename.endswith('.jpg'): assert data.startswith(b'\xff\xd8'),filename
              (target/filename).write_bytes(data)
              print('Verified',filename,len(data))
          PY
      - name: Publish original and clarified screenshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portfolio/blender-*-enhanced.png assets/portfolio/blender-*-original.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add clarified Blender screenshots and untouched originals'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
