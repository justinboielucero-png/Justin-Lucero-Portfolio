name: Upload Midterm original screenshots
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-midterm-files.yml]
permissions:
  contents: write
jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Transfer and verify images without compression
        env:
          IMAGE_1: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/8dc7576c-3bbe-432d-b137-26506ccb119b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDhhMWYyMmNkNzkxNWMyOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ2NjIyMH0.C1tI7-FWvtJs2SipoHQuSH2QvccZQRd9z1e812phd98"
          IMAGE_2: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b4fe1e5a-d293-4404-940e-820f98a3c9bf.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTdiNGExMzMzYjZkMmJjZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUwNTEzOX0.jGNP9J-l7mvmeJT2Ch4rx8CalFZugV5PvLdtkovenmg"
          IMAGE_3: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/03c05624-9a74-4214-95fd-aefae3a98605.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzViZTc0ZjRhMmM0MzhjYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ5NDQ1Mn0.fMrVu5OQCGAoefjDcRTwOnasTg5aJH_k9gIAe7rt31I"
          IMAGE_4: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/e06f8f91-5cc3-44e5-a936-6591c48ee4ff.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDBhNzVmYTc0ODUzZTU2ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ4OTEyN30.XHKb9c_j2xkQfcG1B9fq0IbevsOHMVNwFNDTXEnw8v4"
        run: |
          set -euo pipefail
          mkdir -p assets/midterm
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_1" --output "assets/midterm/investment-calculator.png"
          echo 'bbc516eaa39ae56b23417333941011a7a40ed782d8c0a931076b451b0fbc96ef  assets/midterm/investment-calculator.png' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_2" --output "assets/midterm/operator-activities.jpg"
          echo '213819a740a70e13eaefbb4e86a079faa5f65db3eb09d148d678c8cf0837dbe7  assets/midterm/operator-activities.jpg' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_3" --output "assets/midterm/preliminary-grade-calculator.png"
          echo '7fa6cb12e3e984643583a8ba852c1dc424eda7db7953386308cbc31eafe04e52  assets/midterm/preliminary-grade-calculator.png' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_4" --output "assets/midterm/student-information-program.png"
          echo '012ae24096a5e59cdd54f9762a95f7fd282106ac13123bcb08d7eaed65d2f3ba  assets/midterm/student-information-program.png' | sha256sum -c -
      - name: Publish Midterm screenshots to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/midterm/
          if ! git diff --cached --quiet; then
            git commit -m "Add four original Midterm coursework screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
