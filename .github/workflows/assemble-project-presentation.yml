name: Assemble Justin's original project presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-project-presentation.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble and verify MP4 without reencoding
        shell: bash
        run: |
          set -euo pipefail
          cat assets/portfolio/.video-project-upload-part-{00..10} > assets/portfolio/video-project-presentation.mp4
          echo '4ea9deaa04904471ed27df9a7a3eea850e324e3e0b123826fbeab10e63b99497  assets/portfolio/video-project-presentation.mp4' | sha256sum --check
          test "$(wc -c < assets/portfolio/video-project-presentation.mp4)" -eq 6159105
          echo '9693600ef3602addc52331bf3285bd0a7f0420aa8fc95b90cc6009f86d2bdb74  assets/portfolio/video-project-poster.jpg' | sha256sum --check
      - name: Commit video and poster, remove temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm assets/portfolio/.video-project-upload-part-*
          git add assets/portfolio/video-project-presentation.mp4 assets/portfolio/video-project-poster.jpg
          git commit -m "Add original Video Project Presentation MP4 and thumbnail"
          git pull --rebase origin main
          git push origin HEAD:main
